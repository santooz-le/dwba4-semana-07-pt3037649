<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>HOME - IFSP - Pirituba - CSS - Semana 06</title>

    <link rel="stylesheet" href="css/conteudo.css" />

  <body id="top">
    <header id="cabecalho">
      <nav>
        <object width="100%" height="200px" data="menu.html"></object>

    <main id="conteudo">
      <section class="grid-container">
        <figure class="grid-item">
          <a href="#" aria-label="Eleições IFSP">
            <img src="eleicoes.jpg" alt="Eleições IFSP" />
          </a>
          <figcaption>
            <strong>Radar IFSP: informe-se sobre as eleições do dia 13 de outubro</strong><br>
            Todos os alunos e servidores podem votar; acesse aqui a cabine de votação online do seu câmpus
          </figcaption>
        </figure>

        <figure class="grid-item">
          <a href="#" aria-label="Semana Nacional de Ciência e Tecnologia">
            <img src="snct.jpg" alt="Semana Nacional de Ciência e Tecnologia" />

        </figure>

        <figure class="grid-item">
          <a href="#" aria-label="Residência Pedagógica">

          </figcaption>
        </figure>

      <section class="inovacao-section">
        <h2>Conheça os desafios de inovação</h2>
        <div class="videoWrapper square-video">
          <iframe
            src="https://www.youtube.com/embed/5g5LQe3m8Po?si=czt8U-9_2DlQv28R"
            title="YouTube video player"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen

        </div>
